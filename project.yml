name: Heirloom
options:
  bundleIdPrefix: com.heirloom
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: Q2HHH2GDN8

targets:
  Heirloom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heirloom.app
      DEVELOPMENT_TEAM: Q2HHH2GDN8
      INFOPLIST_FILE: Heirloom/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: false
      ENABLE_PREVIEWS: true

    sources:
      - path: Heirloom
        excludes:
          - "**/.DS_Store"
          - "**/._*"

    info:
      path: Heirloom/Resources/Info.plist
      properties:
        CFBundleDisplayName: Heirloom
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSRemindersFullAccessUsageDescription: "Heirloom exports your shopping list to Reminders so you can check off items while shopping."
        NSCameraUsageDescription: "Heirloom needs camera access to photograph recipe cards from your cookbooks."
        NSPhotoLibraryUsageDescription: "Heirloom needs photo library access to import recipe images."
        NSPhotoLibraryAddUsageDescription: "Heirloom saves recipe images to your photo library when you share styled recipe cards."

    dependencies:
      - package: SwiftSoup

    entitlements:
      path: Heirloom/Heirloom.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.heirloom.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.heirloom.app
        com.apple.security.application-groups:
          - group.com.heirloom.shared

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.6.0"

schemes:
  Heirloom:
    build:
      targets:
        Heirloom: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
