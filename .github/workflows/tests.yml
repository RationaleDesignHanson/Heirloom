name: Heirloom Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  XCODE_VERSION: '16.2'
  IOS_SIMULATOR: 'iPhone 16 Pro'
  IOS_VERSION: '18.3'

jobs:
  # Job 1: Build Validation (Fast - runs first)
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: List available SDKs and simulators
      run: |
        echo "=== Available SDKs ==="
        xcodebuild -showsdks
        echo ""
        echo "=== Available iOS Simulators ==="
        xcrun simctl list devices available --json | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | select(.value | length > 0) | "\(.key): \(.value | map(.name) | join(", "))"' | head -10

    - name: Install iOS 18.3 Simulator Runtime
      run: |
        # Check if iOS 18.3 runtime is already installed
        if ! xcrun simctl list runtimes | grep -q "iOS 18.3"; then
          echo "Installing iOS 18.3 simulator runtime..."
          xcodebuild -downloadPlatform iOS
        else
          echo "iOS 18.3 runtime already installed"
        fi

    - name: Create iOS 18.3 Simulator if needed
      run: |
        # List runtimes to verify
        xcrun simctl list runtimes | grep iOS || true

        # Create iPhone 16 Pro simulator for iOS 18.3 if it doesn't exist
        RUNTIME=$(xcrun simctl list runtimes | grep "iOS 18.3" | head -1 | awk -F'[()]' '{print $2}')
        if [ -n "$RUNTIME" ]; then
          echo "Found iOS 18.3 runtime: $RUNTIME"
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep "iPhone 16 Pro," | head -1 | awk -F'[()]' '{print $2}')
          if [ -n "$DEVICE_TYPE" ]; then
            echo "Creating simulator with device type: $DEVICE_TYPE"
            xcrun simctl create "iPhone 16 Pro" "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null || echo "Simulator may already exist"
          fi
        fi

        # List available devices
        xcrun simctl list devices available | grep "iPhone 16 Pro" || echo "No iPhone 16 Pro found"

    - name: Build for testing
      run: |
        xcodebuild build-for-testing \
          -project Heirloom.xcodeproj \
          -scheme Heirloom \
          -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty --color && exit ${PIPESTATUS[0]}

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    needs: build
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install iOS 18.3 Simulator Runtime
      run: |
        # Check if iOS 18.3 runtime is already installed
        if ! xcrun simctl list runtimes | grep -q "iOS 18.3"; then
          echo "Installing iOS 18.3 simulator runtime..."
          xcodebuild -downloadPlatform iOS
        else
          echo "iOS 18.3 runtime already installed"
        fi

    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -project Heirloom.xcodeproj \
          -scheme Heirloom \
          -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
          -only-testing:HeirloomTestsV2 \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty --color --report junit --output test-results.xml && exit ${PIPESTATUS[0]}

    - name: Generate Coverage Report
      if: always()
      run: |
        if [ -d "TestResults.xcresult" ]; then
          xcrun xccov view --report TestResults.xcresult || true
          xcrun xccov view --report --json TestResults.xcresult > coverage.json || echo "{}" > coverage.json
        fi

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          TestResults.xcresult
          test-results.xml
        retention-days: 14

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.json
        retention-days: 14

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        if [ -f "test-results.xml" ]; then
          TESTS=$(grep -o 'tests="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*' || echo "0")
          FAILURES=$(grep -o 'failures="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*' || echo "0")
          echo "- **Tests Run:** $TESTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Failures:** $FAILURES" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILURES" = "0" ]; then
            echo "- **Status:** ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- **Status:** ⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi

  # Job 3: Code Quality (SwiftLint)
  lint:
    name: Code Quality
    runs-on: macos-15
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint || true

    - name: Run SwiftLint
      run: |
        if command -v swiftlint &> /dev/null; then
          echo "## SwiftLint Results" >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter github-actions-logging --quiet Heirloom/ || true
          WARNINGS=$(swiftlint lint --reporter json Heirloom/ 2>/dev/null | jq length || echo "0")
          echo "- **Warnings:** $WARNINGS" >> $GITHUB_STEP_SUMMARY
        else
          echo "SwiftLint not available, skipping"
          echo "## SwiftLint Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ⚠️ SwiftLint not installed" >> $GITHUB_STEP_SUMMARY
        fi

  # Job 4: Security Checks
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY

        # Check for API keys (require full key pattern, not just prefix)
        # Exclude: prefix definitions, placeholder text, examples
        if grep -rn 'sk-ant-api[0-9][0-9]-[a-zA-Z0-9_-]\{20,\}' Heirloom/ --include="*.swift" | \
           grep -v "YOUR-KEY" | grep -v "placeholder" | grep -v "example" | grep -v "test"; then
          echo "❌ Found potential API key" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        # Check for hardcoded passwords
        if grep -rn 'password\s*=\s*"[^"]\+"' Heirloom/ --include="*.swift" | grep -v "test" | grep -v "placeholder"; then
          echo "⚠️ Found potential hardcoded password" >> $GITHUB_STEP_SUMMARY
        fi

        # Check for private keys
        if grep -rn "PRIVATE KEY" Heirloom/ --include="*.swift"; then
          echo "❌ Found private key reference" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "- **Status:** ✅ No obvious secrets found" >> $GITHUB_STEP_SUMMARY

    - name: Check for sensitive files
      run: |
        SENSITIVE_FILES=(".env" "credentials.json" "secrets.json" "*.pem" "*.key")
        for pattern in "${SENSITIVE_FILES[@]}"; do
          if find . -name "$pattern" -not -path "*/node_modules/*" | grep -q .; then
            echo "⚠️ Found sensitive file pattern: $pattern" >> $GITHUB_STEP_SUMMARY
          fi
        done

  # Job 5: Dependency Audit
  dependencies:
    name: Dependency Check
    runs-on: macos-15
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Package.resolved exists
      run: |
        echo "## Dependency Check" >> $GITHUB_STEP_SUMMARY
        if [ -f "Heirloom.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" ]; then
          echo "- **SPM Dependencies:** ✅ Package.resolved found" >> $GITHUB_STEP_SUMMARY
          DEPS=$(cat Heirloom.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | jq '.pins | length' 2>/dev/null || echo "unknown")
          echo "- **Package Count:** $DEPS" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **SPM Dependencies:** ⚠️ No Package.resolved found" >> $GITHUB_STEP_SUMMARY
        fi

  # Summary Job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, unit-tests, lint, security, dependencies]
    if: always()

    steps:
    - name: Check Results
      run: |
        echo "# 📊 Heirloom CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.lint.result == 'success' && '✅' || '⚠️' }} ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Dependencies | ${{ needs.dependencies.result == 'success' && '✅' || '⚠️' }} ${{ needs.dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Fail if critical jobs failed
        if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ **Critical checks failed**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **All critical checks passed**" >> $GITHUB_STEP_SUMMARY
        fi
