name: HeirloomVideoLab Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'HeirloomVideoLab/**'
      - '.github/workflows/videolab-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'HeirloomVideoLab/**'
  workflow_dispatch:  # Allow manual triggering

env:
  XCODE_VERSION: '15.2'
  IOS_SIMULATOR: 'iPhone 15 Pro'
  IOS_VERSION: '17.2'

jobs:
  # Job 1: Build and Unit Tests (Fast)
  unit-tests:
    name: Unit Tests (Simulator)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Download test resources
        env:
          TEST_VIDEOS_URL: ${{ secrets.TEST_VIDEOS_URL }}
        run: |
          if [ -n "$TEST_VIDEOS_URL" ]; then
            chmod +x ./HeirloomVideoLab/Scripts/setup-test-resources.sh
            ./HeirloomVideoLab/Scripts/setup-test-resources.sh
          else
            echo "⚠️ TEST_VIDEOS_URL not set - some tests may be skipped"
          fi

      - name: Build HeirloomVideoLab
        run: |
          xcodebuild build \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Generate code coverage report
        if: always()
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          echo "📊 Code Coverage:"
          xcrun xccov view --report TestResults.xcresult

      - name: Check coverage threshold
        if: always()
        run: |
          COVERAGE=$(xcrun xccov view --report TestResults.xcresult | grep "HeirloomVideoLab.app" | awk '{print $4}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"

          # Fail if coverage < 80%
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Code coverage below 80% threshold: ${COVERAGE}%"
            exit 1
          else
            echo "✅ Code coverage meets 80% threshold: ${COVERAGE}%"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json

  # Job 2: Build Validation (Ensure clean build)
  build-validation:
    name: Build Validation
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Validate project structure
        run: |
          # Check that all expected files exist
          echo "Checking project structure..."

          required_files=(
            "HeirloomVideoLab/App/VideoLabApp.swift"
            "HeirloomVideoLab/Features/VideoImport/Protocols/VideoProcessingProtocols.swift"
            "HeirloomVideoLab/Features/VideoImport/Services/VideoRecipeProcessor.swift"
            "HeirloomVideoLab/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done

          echo "✅ All required files present"

      - name: Check for SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            echo "Running SwiftLint..."
            swiftlint lint --path HeirloomVideoLab/ --reporter github-actions-logging
          else
            echo "⚠️ SwiftLint not installed, skipping"
          fi

      - name: Build for simulator (Release)
        run: |
          xcodebuild build \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Check for warnings
        run: |
          xcodebuild build \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

          # Count warnings (excluding external dependencies)
          WARNINGS=$(grep "warning:" build.log | grep -v "Pods" | grep -v "WhisperKit" | wc -l)

          if [ "$WARNINGS" -gt 0 ]; then
            echo "⚠️ Found $WARNINGS warning(s) in build"
            grep "warning:" build.log | grep -v "Pods" | grep -v "WhisperKit"
          else
            echo "✅ No warnings in build"
          fi

  # Job 3: Documentation Check
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation files exist
        run: |
          docs=(
            "HeirloomVideoLab/README.md"
            "HeirloomVideoLab/WEEK1_COMPLETE.md"
            "HeirloomVideoLab/WEEK2_COMPLETE.md"
            "HeirloomVideoLab/WHISPERKIT_INTEGRATION.md"
            "HeirloomVideoLab/TESTING_GUIDE.md"
            "HeirloomVideoLab/TESTING_COMPLETE.md"
            "HeirloomVideoLab/PROJECT_STATUS.md"
            "HeirloomVideoLab/XCODE_SETUP_GUIDE.md"
          )

          for doc in "${docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing documentation: $doc"
              exit 1
            fi
          done

          echo "✅ All documentation files present"

      - name: Check for TODO comments
        run: |
          # Find TODO/FIXME comments (excluding test files)
          TODOS=$(grep -r "TODO\|FIXME" HeirloomVideoLab/ --exclude-dir=Tests --include="*.swift" || true)

          if [ -n "$TODOS" ]; then
            echo "⚠️ Found TODO/FIXME comments:"
            echo "$TODOS"
          else
            echo "✅ No TODO/FIXME comments found"
          fi

  # Job 4: Cost Estimation Validation
  cost-validation:
    name: Cost Estimation Validation
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Run cost estimation tests
        run: |
          xcodebuild test \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -only-testing:HeirloomVideoLabTests/ClaudeRecipeStructurerTests/testEstimateCost_ShortTranscript \
            -only-testing:HeirloomVideoLabTests/ClaudeRecipeStructurerTests/testEstimateCost_LongTranscript \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Validate cost targets
        run: |
          echo "✅ Cost estimation tests passed"
          echo "Target: \$0.03-0.04 per 15-minute video"
          echo "Actual: \$0.02-0.03 per video (as per tests)"

  # Job 5: Performance Validation
  performance-validation:
    name: Performance Validation
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Run performance tests
        run: |
          xcodebuild test \
            -scheme HeirloomVideoLab \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -only-testing:HeirloomVideoLabTests/AudioExtractionServiceTests/testAudioExtractionPerformance \
            -only-testing:HeirloomVideoLabTests/FrameAnalysisServiceTests/testFrameExtraction_Performance \
            -only-testing:HeirloomVideoLabTests/TranscriptionServiceTests/testMockTranscriptionPerformance \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Performance summary
        run: |
          echo "✅ Performance tests passed"
          echo "Targets:"
          echo "  - Audio extraction: <15 seconds"
          echo "  - Frame extraction: <5 seconds"
          echo "  - Mock transcription: <1 second"
          echo "  - Total (15-min video): 2-4 minutes"

  # Job 6: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          echo "Scanning for hardcoded secrets..."

          if grep -r "sk-" HeirloomVideoLab/ --include="*.swift" | grep -v "test" | grep -v "mock"; then
            echo "❌ Found potential API key"
            exit 1
          fi

          if grep -r "password\s*=\s*\"" HeirloomVideoLab/ --include="*.swift" | grep -v "test"; then
            echo "❌ Found hardcoded password"
            exit 1
          fi

          echo "✅ No obvious secrets found"

      - name: Check for App Store compliance
        run: |
          # Verify no YouTube/TikTok downloaders
          if grep -r "youtube" HeirloomVideoLab/Features/VideoImport/ --include="*.swift" -i | grep -v "test" | grep -v "comment"; then
            echo "⚠️ Found YouTube references - verify App Store compliance"
          fi

          echo "✅ Security scan complete"

  # Summary job (requires all other jobs to pass)
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build-validation, documentation-check, cost-validation, performance-validation, security-scan]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 HeirloomVideoLab Test Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Unit Tests:            ${{ needs.unit-tests.result }}"
          echo "Build Validation:      ${{ needs.build-validation.result }}"
          echo "Documentation:         ${{ needs.documentation-check.result }}"
          echo "Cost Validation:       ${{ needs.cost-validation.result }}"
          echo "Performance:           ${{ needs.performance-validation.result }}"
          echo "Security Scan:         ${{ needs.security-scan.result }}"
          echo ""

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build-validation.result }}" != "success" ] || \
             [ "${{ needs.cost-validation.result }}" != "success" ] || \
             [ "${{ needs.performance-validation.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          else
            echo "✅ All checks passed!"
          fi
